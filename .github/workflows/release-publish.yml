# Draft release / pack dry-run workflow (sdks-devtools-v1 ticket 15).
#
# Blocked on enabling CI for this repo: planning/.scratch/v1-tracker/issues/35-ci-github-actions-sdk-repos.md
# (#35 is ready-for-human — runners, secrets, branch protection). Until #35 lands:
# - Treat this file as the intended workflow shape
# - Run the dry-run locally: pnpm run pack:dry-run
#
# Required secrets for the publish job (never commit): NPM_TOKEN (npm org publish).
# Provenance uses GitHub OIDC (permissions.id-token: write).

name: Release publish

on:
  pull_request:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  dry-run:
    name: pnpm pack + publint dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Pack dry-run
        run: pnpm run pack:check
      - name: publint
        run: pnpm run publint

  publish:
    name: npm publish (provenance)
    if: startsWith(github.ref, 'refs/tags/')
    needs: dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' must equal package.json version '$version' (no v prefix)" >&2
            exit 1
          fi
      - name: Build version inject
        run: pnpm run build
      - name: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; cannot publish." >&2
            exit 1
          fi
          pnpm publish --access public --provenance --no-git-checks
